<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>CRUD alkalmazás</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Helységek CRUD</h1>
    </header>

    <nav>
        <ul id="menu"> 
            <li><a href="index.html">Főoldal</a></li>
            <li><a href="javascript.html" class="active">JavaScript </a></li>
            <li><a href="react.html"> React </a></li>
            <li><a href="spa.html"> SPA </a></li>
            <li><a href="oojs.html"> OOJS</a></li>
        </ul>
    </nav>

    <h3>Adjon hozzá az adatbázishoz:</h3>
    <input type="text" id="nev" placeholder="Név">
    <input type="text" id="orszag" placeholder="Ország">
    <button onclick="createItem()">Hozzáadás</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Név</th>
                <th>Ország</th>
                <th>Műveletek</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script>
        let helysegek = [
            { az: 1, nev: "Sousse", orszag: "Tunézia" },
            { az: 2, nev: "Djerba", orszag: "Tunézia" },
            { az: 3, nev: "Sharm El Sheikh", orszag: "Egyiptom" },
            { az: 4, nev: "Hurghada", orszag: "Egyiptom" }
        ];

        function render() {
            const lista = document.getElementById("lista");
            lista.innerHTML = "";

            helysegek.forEach(item => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${item.az}</td>
                    <td>${item.nev}</td>
                    <td>${item.orszag}</td>
                    <td>
                        <button onclick="updateItem(${item.az})">Szerkeszt</button>
                        <button onclick="deleteItem(${item.az})">Törlés</button>
                    </td>
                `;

                lista.appendChild(tr);
            });
        }

        function createItem() {
            const nev = document.getElementById("nev").value;
            const orszag = document.getElementById("orszag").value;

            if (!nev || !orszag) return alert("Minden mezőt ki kell tölteni!");

            const uj = {
                az: helysegek.length ? Math.max(...helysegek.map(h => h.az)) + 1 : 1,
                nev,
                orszag
            };

            helysegek.push(uj);
            render();
        }

        function updateItem(az) {
            const item = helysegek.find(h => h.az === az);

            const ujNev = prompt("Új név:", item.nev);
            const ujOrszag = prompt("Új ország:", item.orszag);

            if (ujNev && ujOrszag) {
                item.nev = ujNev;
                item.orszag = ujOrszag;
                render();
            }
        }

        function deleteItem(az) {
            helysegek = helysegek.filter(h => h.az !== az);
            render();
        }

        // Inicializálás
        render();
    </script>

</body>
</html>
