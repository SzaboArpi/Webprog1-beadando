<!DOCTYPE html>
<html lang="hu">
<head>
    <title>Fetch API CRUD</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { cursor: pointer; background: #f0f0f0; }
        input, select, button { margin: 5px; padding: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<h2>Adatbázis kezelő</h2>

<!-- Táblaválasztás -->
<select id="tableSelect">
    <option value="">-- Válassz táblát --</option>
    <option value="helyseg">helyseg</option>
    <option value="varosok">varosok</option>
</select>

<!-- Keresés -->
<input type="text" id="searchInput" placeholder="Keresés...">

<!-- Loading -->
<p id="loading" class="hidden">Betöltés...</p>

<!-- Táblázat -->
<table id="dataTable">
    <thead></thead>
    <tbody></tbody>
</table>

<!-- Űrlap -->
<h3 id="formTitle">Új rekord</h3>
<form id="dataForm"></form>
<button onclick="submitForm()">Mentés</button>

<script>
const API_URL = 'adatbazis.php';

let currentTable = '';
let tableData = [];
let columns = [];
let editId = null;
let sortDirection = 1;

// Táblaválasztás
document.getElementById('tableSelect').addEventListener('change', (e) => {
    currentTable = e.target.value;
    fetchData();
});

// Keresés
document.getElementById('searchInput').addEventListener('input', renderTable);

// Adatlekérés
async function fetchData() {
    if (!currentTable) return;

    showLoading(true);

    try {
        const res = await fetch(`${API_URL}?table=${currentTable}`);
        const json = await res.json();

        columns = json.columns;
        tableData = json.data;

        renderTable();
        generateForm();

    } catch (err) {
        alert('Hiba a lekérés során');
        console.error(err);
    } finally {
        showLoading(false);
    }
}

// Táblázat render
function renderTable() {
    const thead = document.querySelector('#dataTable thead');
    const tbody = document.querySelector('#dataTable tbody');

    thead.innerHTML = '';
    tbody.innerHTML = '';

    // Fejléc
    let headerRow = '<tr>';
    columns.forEach(col => {
        headerRow += `<th onclick="sortTable('${col}')">${col}</th>`;
    });
    headerRow += '<th>Műveletek</th></tr>';
    thead.innerHTML = headerRow;

    // Szűrés
    const filter = document.getElementById('searchInput').value.toLowerCase();

    let filtered = tableData.filter(row =>
        Object.values(row).some(val =>
            String(val).toLowerCase().includes(filter)
        )
    );

    // Sorok
    filtered.forEach(row => {
        let tr = '<tr>';
        columns.forEach(col => {
            tr += `<td>${row[col]}</td>`;
        });

        tr += `
            <td>
                <button onclick='editRow(${JSON.stringify(row)})'>Szerkeszt</button>
                <button onclick='deleteRow(${row.id})'>Töröl</button>
            </td>
        </tr>`;

        tbody.innerHTML += tr;
    });
}

// Rendezés
function sortTable(col) {
    sortDirection *= -1;
    tableData.sort((a, b) => {
        if (a[col] < b[col]) return -1 * sortDirection;
        if (a[col] > b[col]) return 1 * sortDirection;
        return 0;
    });
    renderTable();
}

// Űrlap generálás
function generateForm() {
    const form = document.getElementById('dataForm');
    form.innerHTML = '';

    columns.forEach(col => {
        if (col === 'id') return;

        form.innerHTML += `
            <label>${col}:</label>
            <input type="text" name="${col}" /><br>
        `;
    });
}

// CREATE / UPDATE
async function submitForm() {
    const form = document.getElementById('dataForm');
    const formData = new FormData(form);

    let data = {};
    formData.forEach((value, key) => data[key] = value);

    data.table = currentTable;

    if (editId) {
        data.id = editId;
        data.action = 'update';
    } else {
        data.action = 'create';
    }

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const json = await res.json();

        if (json.success) {
            fetchData();
            form.reset();
            editId = null;
            document.getElementById('formTitle').innerText = 'Új rekord';
        }

    } catch (err) {
        alert('Hiba mentéskor');
    }
}

// EDIT
function editRow(row) {
    const form = document.getElementById('dataForm');

    columns.forEach(col => {
        if (col === 'id') return;
        form.elements[col].value = row[col];
    });

    editId = row.id;
    document.getElementById('formTitle').innerText = 'Szerkesztés';
}

// DELETE
async function deleteRow(id) {
    if (!confirm('Biztos törlöd?')) return;

    try {
        const res = await fetch(API_URL, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, table: currentTable })
        });

        const json = await res.json();

        if (json.success) {
            tableData = tableData.filter(row => row.id !== id);
            renderTable();
        }

    } catch (err) {
        alert('Hiba törléskor');
    }
}

// Loading
function showLoading(state) {
    document.getElementById('loading').classList.toggle('hidden', !state);
}
</script>

</body>
</html>
