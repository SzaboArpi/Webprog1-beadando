<!DOCTYPE html>
<html>
<head>
    <title>OOJS Menü</title>
    <script src="oojs.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script>
        let menu = new ColoredMenu("Főmenü", 500, 200, "lightblue");
    </script>
    <header>
        <h1>Menü vezérlés</h1>
    </header>
    <nav>
        <ul id="menu">
            <li><a href="index.html">Főoldal</a></li>
            <li><a href="javascript.html">JavaScript </a></li>
            <li><a href="react.html"> React </a></li>
            <li><a href="spa.html"> SPA </a></li>
            <li><a href="oojs.html"  class="active"> OOJS</a></li>
        </ul>
    </nav>
    <p><strong>Adjon a Főmenü-hoz új menüpontokat</strong!></p>

    <button onclick="menu.show()">Mutat</button>
    <button onclick="menu.hide()">Elrejt</button>

    <br><br>

    <input type="text" id="itemText" placeholder="Új menüpont">
    <button onclick="menu.addItem(itemText.value)">Hozzáadás</button>

    <br><br>

    <input type="text" id="x" placeholder="X">
    <input type="text" id="y" placeholder="Y">
    <button onclick="menu.moveTo(x.value, y.value)">Mozgatás</button>

</body>
</html>
